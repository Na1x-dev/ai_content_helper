version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ai_helper_db
    restart: always
    environment:
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password
      POSTGRES_DB: ai_content_db
    ports:
      - "5432:5432" # Вынесли стандартный порт наружу для удобства локальной отладки
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d ai_content_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_helper_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    # Команда сначала ждет БД, делает миграции, а затем запускает сервер
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py init &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    command: celery -A core worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./ai_content_helper_front
    container_name: ai_helper_front
    volumes:
      - ./ai_content_helper_front:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/
    env_file:
      - .env
    depends_on:
      - web

volumes:
  postgres_data:
