name: AI Content Helper CI

# Сценарий запускается при каждом push или Pull Request в ветку main (или master)
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # --- РАБОТА 1: ТЕСТИРОВАНИЕ БЭКЕНДА (DJANGO) ---
  backend-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Проверяем репозиторий (Checkout)
      uses: actions/checkout@v4

    - name: Устанавливаем Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Устанавливаем зависимости бэкенда
      run: |
        cd ai_content_helper_back
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage  # Устанавливаем coverage для отчета

    - name: Запуск тестов Django со сбором покрытия
      env:
        # Передаем фейковые переменные окружения, чтобы Django запустился в CI
        SECRET_KEY: "ci-test-secret-key-12345"
        DEBUG: "True"
        DATABASE_URL: "sqlite:///:memory:"  # В CI используем быструю базу в памяти
        AI_MOCK_MODE: "True"
      run: |
        cd ai_content_helper_back
        coverage run --source='posts' manage.py test posts
        coverage report -m

  # --- РАБОТА 2: ТЕСТИРОВАНИЕ ФРОНТЕНДА (REACT) ---
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Проверяем репозиторий (Checkout)
      uses: actions/checkout@v4

    - name: Устанавливаем Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ai_content_helper_front/package-lock.json

    - name: Устанавливаем зависимости фронтенда
      run: |
        cd ai_content_helper_front
        npm ci  # Чистая быстрая установка пакетов для CI систем

    - name: Запуск тестов Vitest
      run: |
        cd ai_content_helper_front
        npm run test
