name: AI Content Helper CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # --- РАБОТА 1: БЭКЕНД (ЛИНТЕР + ТЕСТЫ) ---
  backend:
    runs-on: ubuntu-latest

    steps:
    - name: Проверяем репозиторий (Checkout)
      uses: actions/checkout@v4

    - name: Устанавливаем Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Устанавливаем зависимости бэкенда
      run: |
        cd ai_content_helper_back
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage flake8  # Добавляем линтер flake8

    - name: Проверка стиля кода Python (Линтинг Flake8)
      run: |
        cd ai_content_helper_back
        # Проверяем синтаксические ошибки. Если они есть, CI упадет.
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Проверяем общие правила стиля (длина строк, пробелы). 
        # max-line-length=120, чтобы линтер не ругался на длинные строки
        flake8 . --count --max-line-length=120 --statistics

    - name: Запуск тестов Django со сбором покрытия
      env:
        SECRET_KEY: "ci-test-secret-key-12345"
        DEBUG: "True"
        DATABASE_URL: "sqlite:///:memory:"
        AI_MOCK_MODE: "True"
      run: |
        cd ai_content_helper_back
        coverage run --source='posts' manage.py test posts
        coverage report -m

  # --- РАБОТА 2: ФРОНТЕНД (ЛИНТЕР + ТЕСТЫ) ---
  frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Проверяем репозиторий (Checkout)
      uses: actions/checkout@v4

    - name: Устанавливаем Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ai_content_helper_front/package-lock.json

    - name: Устанавливаем зависимости фронтенда
      run: |
        cd ai_content_helper_front
        npm ci

    - name: Проверка стиля кода React (Линтинг ESLint)
      run: |
        cd ai_content_helper_front
        npm run lint

    - name: Запуск тестов Vitest
      run: |
        cd ai_content_helper_front
        npm run test
